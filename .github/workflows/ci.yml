name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  # Each crate gets its own powerset, configured by its hack.toml. A crate
  # without one falls back to the default pairwise powerset.
  discover:
    name: Discover crates
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.list.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          crates=$(find crates -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "discovered: $crates"

  clippy:
    name: Clippy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-hack
      - name: Clippy powerset
        shell: bash
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -euo pipefail
          flags=$(python3 .github/scripts/hack-flags.py "crates/$CRATE")
          echo "hack flags: $flags"
          # unquoted: the translator emits several arguments
          # shellcheck disable=SC2086
          cargo hack clippy -p "$CRATE" $flags -- -D warnings

  test:
    name: Test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-hack,cargo-nextest
      - name: Test powerset
        shell: bash
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -euo pipefail
          flags=$(python3 .github/scripts/hack-flags.py "crates/$CRATE")
          echo "hack flags: $flags"
          # unquoted: the translator emits several arguments
          # shellcheck disable=SC2086
          cargo hack nextest run -p "$CRATE" $flags --no-tests=pass

  # hack.toml skips the docs feature, so it is covered here instead.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # chainfold proofs. CI uses the x86 release; see verus-gates.py for
  # what the static gates catch that Verus itself does not. Never cache target/:
  # stale Verus artifacts can skip verification.
  verus:
    name: Verus (chainfold)
    runs-on: ubuntu-latest
    env:
      VERUS_VERSION: 0.2026.09.20.aef82ed
      VERUS_SHA256: 7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33
      # Raise whenever proofs are added, so dropped proofs fail the job.
      VERUS_MIN_VERIFIED: 304
    steps:
      - uses: actions/checkout@v7
      - name: Static gates
        run: |
          python3 .github/scripts/verus-gates.py --self-test
          python3 .github/scripts/verus-gates.py crates/chainfold
      - name: Install Verus
        shell: bash
        run: |
          set -euo pipefail
          zip="verus-$VERUS_VERSION-x86-linux.zip"
          curl -sSfLO "https://github.com/verus-lang/verus/releases/download/release/$VERUS_VERSION/$zip"
          echo "$VERUS_SHA256  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          dir="$RUNNER_TEMP/verus-x86-linux"
          # e.g. "1.98.1-x86_64-unknown-linux-gnu (overridden by environment variable RUSTUP_TOOLCHAIN)"
          toolchain=$(jq -r '.verus.toolchain | split(" ")[0]' "$dir/version.json")
          rustup toolchain install "$toolchain" --profile minimal \
            --component rustc-dev --component llvm-tools
          # beats the repo's rust-toolchain.toml
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          cargo verus verify -p chainfold --features verus,wincode \
            --check-toolchain --fwd-verus-args-to roots 2>&1 | tee "$RUNNER_TEMP/verus.log"
          # A cached or skipped run prints no results line and proves nothing, so require
          # exactly one "N verified, 0 errors" line with N at or above the floor.
          n=$(sed -nE 's/^verification results:: ([0-9]+) verified, 0 errors$/\1/p' "$RUNNER_TEMP/verus.log")
          case "$n" in
            '' | *[!0-9]*) echo "::error::no single 'N verified, 0 errors' line"; exit 1 ;;
          esac
          if [ "$n" -lt "$VERUS_MIN_VERIFIED" ]; then
            echo "::error::$n verified, below the floor of $VERUS_MIN_VERIFIED"
            exit 1
          fi

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, discover, clippy, test, docs, verus]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
