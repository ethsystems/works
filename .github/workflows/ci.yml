name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  # Each crate gets its own powerset, configured by its hack.toml. A crate
  # without one falls back to the default pairwise powerset.
  discover:
    name: Discover crates
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.list.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          crates=$(ls -d crates/*/ | xargs -n1 basename | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "discovered: $crates"

  clippy:
    name: Clippy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-hack
      - name: Clippy powerset
        shell: bash
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -euo pipefail
          flags=$(python3 .github/scripts/hack-flags.py "crates/$CRATE")
          echo "hack flags: $flags"
          # unquoted: the translator emits several arguments
          cargo hack clippy -p "$CRATE" $flags -- -D warnings

  test:
    name: Test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-hack,cargo-nextest
      - name: Test powerset
        shell: bash
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -euo pipefail
          flags=$(python3 .github/scripts/hack-flags.py "crates/$CRATE")
          echo "hack flags: $flags"
          # unquoted: the translator emits several arguments
          cargo hack nextest run -p "$CRATE" $flags --no-tests=pass

  # hack.toml skips the docs feature, so it is covered here instead.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, discover, clippy, test, docs]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
