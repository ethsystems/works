[package]
name = "examples"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "runnable examples that span more than one crate in this workspace"
publish = false

[dev-dependencies]
chainfold = { path = "../chainfold", features = ["storage", "test-helpers"] }
rand_chacha = "0.10"
rotortree = { path = "../rotortree", features = ["storage", "blake3"] }
sealring = { path = "../sealring", features = ["x25519", "std"] }
tempfile = "3"
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets"] }
