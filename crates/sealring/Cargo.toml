[package]
name = "sealring"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "generic sealed-note envelope: seal, open, batch trial-decryption"
include = [
    "src/**/*.rs",
    "benches/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "tests/golden/*.hex",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
rand_core = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false }
subtle = { version = "2.6", default-features = false }
hkdf = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
k256 = { version = "0.14", default-features = false, features = ["ecdh", "arithmetic", "alloc"], optional = true }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"], optional = true }
ark-grumpkin = { version = "0.6", default-features = false, optional = true }
ark-ec = { version = "0.6", default-features = false, optional = true }
ark-ff = { version = "0.6", default-features = false, optional = true }
ark-serialize = { version = "0.6", default-features = false, optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "alloc"], optional = true }
include-utils = { workspace = true, optional = true }
wincode = { workspace = true, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
proptest = { workspace = true, features = ["std", "fork", "timeout", "bit-set"] }
crabtime = { workspace = true, features = ["std"] }
criterion = { workspace = true, features = ["rayon", "plotters", "cargo_bench_support", "html_reports"] }
rand_chacha = "0.10"

[features]
default = []
std = [
    "zeroize/std",
    "subtle/std",
    "serde?/std",
    "wincode?/std",
    "k256?/std",
    "k256?/precomputed-tables",
    "ark-grumpkin?/std",
    "ark-ec?/std",
    "ark-ff?/std",
    "ark-serialize?/std",
]
k256 = ["dep:k256"]
x25519 = ["dep:x25519-dalek"]
grumpkin = ["dep:ark-grumpkin", "dep:ark-ec", "dep:ark-ff", "dep:ark-serialize"]
parallel = ["std", "dep:rayon"]
serde = ["dep:serde"]
wincode = ["dep:wincode"]
test-helpers = []
docs = ["dep:include-utils"]

[[bench]]
name = "scan"
harness = false
required-features = ["x25519", "k256", "grumpkin", "test-helpers", "std"]

[[bench]]
name = "seal"
harness = false
required-features = ["x25519", "k256", "grumpkin", "test-helpers", "std"]

[[bench]]
name = "micro"
harness = false
required-features = ["x25519", "k256", "grumpkin", "test-helpers", "std"]

[[example]]
name = "seal_open"
required-features = ["x25519"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
