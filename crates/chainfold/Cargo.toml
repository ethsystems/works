[package]
name = "chainfold"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "event-sourced chain fold engine: total order, fork recovery, durable snapshots"
include = [
    "src/**/*.rs",
    "benches/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
crc = { version = "3.4", default-features = false, optional = true }
crc-fast = { version = "1.10", default-features = false, optional = true }
include-utils = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "alloc"], optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "rt"], optional = true }
wincode = { workspace = true, features = ["alloc", "derive"], optional = true }
# Pinned to the Verus release in CI; bump both together.
vstd = { version = "=0.0.0-2026-09-20-0158", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
chainfold = { path = ".", features = ["test-helpers"] }
criterion = { workspace = true, features = ["cargo_bench_support", "html_reports", "plotters"] }
proptest = { workspace = true, features = ["std", "fork", "timeout", "bit-set"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros", "time"] }

[features]
default = []
std = ["serde?/std", "wincode?/std", "dep:crc-fast", "crc-fast/std"]
serde = ["dep:serde"]
wincode = ["dep:wincode", "dep:crc"]
storage = ["std", "wincode"]
tokio = ["std", "dep:tokio"]
test-helpers = []
docs = ["dep:include-utils"]
# Pulls in the Verus spec library; proofs only exist under `cargo verus`.
verus = ["dep:vstd"]

[[bench]]
name = "apply"
harness = false
required-features = ["std", "test-helpers"]

[[bench]]
name = "snapshot"
harness = false
required-features = ["std", "wincode", "test-helpers"]

[[bench]]
name = "recover"
harness = false
required-features = ["std", "test-helpers"]

[[example]]
name = "replay"
required-features = ["tokio", "storage", "test-helpers"]

[package.metadata.verus]
verify = true

# Read by .github/scripts/verus-gates.py: every file in src/ is in scope or out of
# scope, and every fn in an in-scope file must be verified or listed here with the
# reason it is not.
[package.metadata.verus-gates]
in-scope = ["src/ring.rs", "src/position.rs", "src/batch.rs", "src/checkpoint.rs", "src/engine.rs", "src/snapshot.rs", "src/driver.rs", "src/error.rs", "src/fold.rs", "src/sink.rs", "src/source.rs", "src/lib.rs", "src/verus/mod.rs", "src/verus/model.rs"]
# Each spec is assumed for every impl Verus does not check (A1 to A5).
trusted-traits = ["Fold", "Source", "SnapshotSink", "Persist"]
# The code behind the codec and checksum items in tcb.rs, and the Verus macros and spec
# library. The manifest pins the version and checksum Cargo.lock gives each.
trusted-crates = ["crc", "crc-catalog", "crc-fast", "verus_builtin", "verus_builtin_macros", "vstd", "wincode", "wincode-derive"]

[package.metadata.verus-gates.out-of-scope-files]
"src/harness.rs" = "threads and async runtime"
"src/storage.rs" = "module wiring for storage"
"src/storage/flusher.rs" = "fsync thread; trusted as a sink (A4)"
"src/storage/manifest.rs" = "manifest codec"
"src/storage/store.rs" = "fsync and file layout"
"src/storage/vfs.rs" = "filesystem calls"
"src/test_util.rs" = "test helpers"

[package.metadata.verus-gates.out-of-scope]
"src/batch.rs::BatchShapeError::fmt" = "Display impl"
"src/engine.rs::Engine::fold_mut" = "user-maintained fold invariant (fold_mut): returns &mut F, edits must keep fview"
"src/snapshot.rs::crc32c" = "trusted: checksum, a function of the bytes (tcb.rs)"
"src/error.rs::FoldError::fmt" = "Display impl"
"src/error.rs::EngineStatus::fmt" = "Display impl"
"src/error.rs::DivergenceCause::fmt" = "Display impl"
"src/error.rs::DurabilityLost::fmt" = "Display impl"
"src/error.rs::ConfigError::fmt" = "Display impl"
"src/error.rs::ApplyError::fmt" = "Display impl"
"src/error.rs::RollbackError::fmt" = "Display impl"
"src/error.rs::HexHash::fmt" = "Display impl"
"src/snapshot.rs::read_envelope" = "trusted: codec deserializer, round trip in tcb.rs"
"src/snapshot.rs::SnapshotError::fmt" = "Display impl"
"src/snapshot.rs::write_payload" = "trusted: codec serializer, appends its bytes (tcb.rs)"
"src/driver.rs::DriverConfig::default" = "config constants, no claim"
"src/driver.rs::DriverConfig::from_block" = "config constants, no claim"
"src/driver.rs::Driver::next_delay" = "timing, no claim"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(verus_keep_ghost)",
    "cfg(verus_keep_ghost_body)",
    "cfg(verus_only)",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
