[package]
name = "chainfold"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "event-sourced chain fold engine: total order, fork recovery, durable snapshots"
include = [
    "src/**/*.rs",
    "benches/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
crc = { version = "3.4", default-features = false, optional = true }
crc-fast = { version = "1.10", default-features = false, optional = true }
include-utils = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "alloc"], optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "rt"], optional = true }
wincode = { workspace = true, features = ["alloc", "derive"], optional = true }
# Pinned to the Verus release in CI; bump both together.
vstd = { version = "=0.0.0-2026-09-20-0158", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
chainfold = { path = ".", features = ["test-helpers"] }
criterion = { workspace = true, features = ["cargo_bench_support", "html_reports", "plotters"] }
proptest = { workspace = true, features = ["std", "fork", "timeout", "bit-set"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros", "time"] }

[features]
default = []
std = ["serde?/std", "wincode?/std", "dep:crc-fast", "crc-fast/std"]
serde = ["dep:serde"]
wincode = ["dep:wincode", "dep:crc"]
storage = ["std", "wincode"]
tokio = ["std", "dep:tokio"]
test-helpers = []
docs = ["dep:include-utils"]
# Pulls in the Verus spec library; proofs only exist under `cargo verus`.
verus = ["dep:vstd"]

[[bench]]
name = "apply"
harness = false
required-features = ["std", "test-helpers"]

[[bench]]
name = "snapshot"
harness = false
required-features = ["std", "wincode", "test-helpers"]

[[bench]]
name = "recover"
harness = false
required-features = ["std", "test-helpers"]

[[example]]
name = "replay"
required-features = ["tokio", "storage", "test-helpers"]

[package.metadata.verus]
verify = true

# Read by .github/scripts/verus-gates.py: every fn in an in-scope file must be
# verified or listed here with the phase that verifies it.
[package.metadata.verus-gates]
in-scope = ["src/ring.rs", "src/position.rs", "src/batch.rs", "src/checkpoint.rs", "src/engine.rs", "src/snapshot.rs"]

[package.metadata.verus-gates.out-of-scope]
"src/batch.rs::BatchShapeError::fmt" = "Display (plan section 5)"
"src/engine.rs::Engine::fold_mut" = "A3: returns &mut F, edits must keep fview"
"src/engine.rs::Engine::apply_batch" = "P5"
"src/engine.rs::Engine::apply_span" = "P5"
"src/engine.rs::Engine::consumed_through" = "P5"
"src/engine.rs::Engine::advance" = "P5"
"src/engine.rs::Engine::halt" = "P5"
"src/engine.rs::Engine::poison" = "P5"
"src/engine.rs::span_pos" = "P5"
"src/engine.rs::count_at_or_below" = "P5"
"src/engine.rs::fork_suspected" = "P5"
"src/snapshot.rs::crc32c" = "A6"
"src/snapshot.rs::read_envelope" = "A6"
"src/snapshot.rs::SnapshotError::fmt" = "Display (plan section 5)"
# Encode writes bytes only; T6c's content claim is model::lemma_durable_snapshot.
"src/snapshot.rs::write_envelope" = "encode bytes (T6c content is a model lemma)"
"src/snapshot.rs::ring_lanes" = "encode bytes (T6c content is a model lemma)"
"src/snapshot.rs::cursor_fields" = "encode bytes (T6c content is a model lemma)"
"src/snapshot.rs::encode_envelope" = "encode bytes (T6c content is a model lemma)"
"src/snapshot.rs::Engine::encode_snapshot" = "encode bytes (T6c content is a model lemma)"
"src/snapshot.rs::Engine::encode_durable_snapshot" = "P7 follow-up: tie its point to durable_point (lemma_durable_snapshot)"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(verus_keep_ghost)",
    "cfg(verus_keep_ghost_body)",
    "cfg(verus_only)",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
